[project]
name = "droid-monkey"
version = "0.1.0"
description = "CLI agent that attacks an Android app with real-world faults, fixes what breaks, and proves each fix by replaying the attack"
readme = "README.md"
authors = [
    { name = "shubhasai", email = "mshubhasai2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.3.0",
    "neatlogs[anthropic,langchain,langgraph]>=1.4.26",
    "perfetto>=0.58.2",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
droid-monkey = "droid_monkey:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

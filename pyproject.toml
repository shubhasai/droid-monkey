[project]
name = "droid-monkey"
version = "0.1.0"
description = "CLI agent that attacks an Android app with real-world faults, fixes what breaks, and proves each fix by replaying the attack"
readme = "README.md"
authors = [
    { name = "shubhasai", email = "mshubhasai2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
droid-monkey = "droid_monkey:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
